name: Build & Release FellClicker Pro Touch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Offiziellen Release-Keystore generieren
        run: |
          if [ ! -f app/fell-release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/fell-release-key.jks \
              -alias fellkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass FellClicker2026 \
              -keypass FellClicker2026 \
              -dname "CN=FellEntertainment, O=FellEntertainment, C=DE"
          fi

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signierte Release-APK kompilieren
        run: gradle assembleRelease --stacktrace

      - name: APK umbenennen für sauberen Download
        run: cp app/build/outputs/apk/release/*.apk FellClicker-Pro-Touch-v1.0.0.apk

      - name: Als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FellClicker-Pro-Touch-v1.0.0
          path: FellClicker-Pro-Touch-v1.0.0.apk

      - name: Offizielles GitHub Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "FellClicker Pro Touch v1.0.0"
          body: |
            ### FellClicker Pro Touch v1.0.0 (Official Android Release)
            - **Dark-Theme UI** im originalen FellClicker Pro Design
            - **Touch-Target Picker:** Direktes Antippen der gewünschten Klick-Position auf dem Bildschirm (`🎯 Ziel antippen`)
            - **Doppelklick-Stopp & Hardware-Not-Aus:** 2x schnell auf das Overlay tippen oder `Leiser`-Taste drücken stoppt sofort
            - **Intervall, Randomizer & Sicherheits-Limits**
          files: FellClicker-Pro-Touch-v1.0.0.apk
          prerelease: false